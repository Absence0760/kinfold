version: 2

updates:
  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Add npm / pip / pub / terraform entries here once the stack is chosen
  # (see docs/STACK.md). Dependabot errors on ecosystems with no manifest.
