name: CI

# Runs the repo's own gates on every push to main: svelte-check typecheck, the
# web Vitest suite, the root-scripts guard, and the pgTAP suite (schema,
# invariants, RLS) against a real local Supabase stack. roadmap.md Stage 0
# promises "green on main" for exactly these.
#
# Pattern: docs/.. and .github/workflows/README-ci-gate.md — this workflow is
# the ONLY emitter of the required `CI gate` check. The `changes` job decides
# whether the push touched anything besides .md files; the heavy jobs are gated
# on it and a skipped job counts as passing, so a docs-only push reports the
# gate green without a second workflow.
#
# e2e (Playwright) is NOT in CI yet: it still runs on demand only (`setup:e2e`
# per machine, then `test:web:e2e`) — see docs/STACK.md "No CI job yet" note
# and followups.md.

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout (full history, to diff the push)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          depth: 0

      - name: Classify the pushed paths
        id: filter
        run: |
          base="${{ github.event.before }}"
          head="$(git rev-parse HEAD)"
          if ! git log -1 "$base" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0   # branch (re)created or force-pushed: run everything
          fi
          code=false
          for f in $(git diff --name-only "$base" "$head"); do
            case "$f" in
              *.md) ;;                                  # docs ship with every change; they alone don't need the tests
              *) code=true ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

  web:
    name: web
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test:web

      - name: Root-scripts guard
        run: pnpm test:scripts

  backend:
    name: backend
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1

      - name: Start the local stack (Docker on the runner, throwaway creds from .env defaults)
        run: cd apps/backend && supabase start

      - name: pgTAP (schema, invariants, RLS)
        run: pnpm test:backend:db

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, web, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          for r in "$CHANGES_RESULT" "$WEB_RESULT" "$BACKEND_RESULT"; do
            case "$r" in
              success|skipped) ;;
              *) echo "heavy job did not pass: $r"; exit 1 ;;
            esac
          done