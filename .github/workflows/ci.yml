name: CI

# Runs the repo's own gates on every push to main: svelte-check typecheck, the
# web Vitest suite, the root-scripts guard, and the pgTAP suite (schema,
# invariants, RLS) against a real local Supabase stack. roadmap.md Stage 0
# promises "green on main" for exactly these.
#
# Pattern: docs/.. and .github/workflows/README-ci-gate.md — this workflow is
# the ONLY emitter of the required `CI gate` check. The `changes` job decides
# whether the push touched anything besides .md files; the heavy jobs are gated
# on it and a skipped job counts as passing, so a docs-only push reports the
# gate green without a second workflow.
#
# docs (markdown) is the one gate that runs on EVERY push, code or docs-only:
# `check_docs_hygiene.mjs` reads every tracked .md file and fails on a tab, a
# trailing space, a triple blank, a table whose rows disagree on width, or a
# relative link/anchor with nothing behind it. roadmap.md's promise is that the
# docs stay readable wherever they are rendered, and a docs-only push is exactly
# the push that would otherwise sail past every gate.
#
# e2e (Playwright) IS in CI: the public prerendered site needs no stack, so the
# public site's e2e specs run on every code push. `e2e` job installs Chromium
# (`setup:e2e`), then Playwright builds the site and serves it itself
# (`webServer: pnpm build && pnpm preview`) — no Docker, no Supabase CLI.
# The stack-dependent member-area flow is still not covered (docs/STACK.md).

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout (full history, to diff the push)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          depth: 0

      - name: Classify the pushed paths
        id: filter
        run: |
          base="${{ github.event.before }}"
          head="$(git rev-parse HEAD)"
          if ! git log -1 "$base" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0   # branch (re)created or force-pushed: run everything
          fi
          code=false
          for f in $(git diff --name-only "$base" "$head"); do
            case "$f" in
              *.md) ;;                                  # docs ship with every change; they alone don't need the tests
              *) code=true ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    name: docs
    # Not gated on the code filter: markdown conformance is a question a docs-only
    # push has to answer for itself, and this job is cheap (no pnpm install, no
    # stack, no browser).
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Markdown hygiene and link audit
        run: node scripts/check_docs_hygiene.mjs

  web:
    name: web
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test:web

      - name: Root-scripts guard
        run: pnpm test:scripts

      - name: Repo invariants
        run: pnpm test:invariants

  mobile:
    name: mobile
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The SDK the repo's local run also carries (docs/STACK.md), cached
      # across runs: the key buckets by year and week (the action's own
      # date-keyed example), so one clone serves a week of pushes and a
      # channel release lands at the next bucket. TTL options belonged to
      # the legacy cache service, which is sunset — the date bucket is the
      # documented shape for this action.
      - name: Get the SDK cache bucket
        id: sdk-week
        run: echo "week=$(/bin/date -u "+%Y-%V")" >> "$GITHUB_OUTPUT"

      - name: Cache the Flutter SDK
        uses: actions/cache@58eb117e85aeb3744e23b8b3f75258e12722217e # v1.3.0
        with:
          path: ${{ runner.home }}/sdk/flutter
          key: flutter-sdk-stable-${{ steps.sdk-week.outputs.week }}

      - name: Install the Flutter SDK
        run: |
          if [ ! -d "$HOME/sdk/flutter/bin" ]; then
            git clone --depth=1 -b stable https://github.com/flutter/flutter.git "$HOME/sdk/flutter"
          fi
          echo "PATH=$HOME/sdk/flutter/bin:$PATH" >> "$GITHUB_PATH"

      # The phone app's lint gate: the same carve-out shape as check:edge
      # (CI's runners don't ship the tool, so the job that bootstraps it runs
      # it), named in the package.json check divider and docs/STACK.md.
      - name: Analyze the phone app
        run: pnpm check:mobile

      - name: Flutter tests
        run: pnpm test:mobile

  backend:
    name: backend
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1

      - name: Start the local stack (Docker on the runner, throwaway creds from .env defaults)
        run: cd apps/backend && supabase start

      - name: pgTAP (schema, invariants, RLS)
        run: pnpm test:backend:db

  e2e:
    name: e2e
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright downloads its own Chromium build; keeping it in a cached
      # directory keyed on the @playwright/test version means one download per
      # version bump, not one per push.
      - name: Cache Playwright's Chromium build
        uses: actions/cache@58eb117e85aeb3744e23b8b3f75258e12722217e # v1.3.0
        with:
          path: apps/web/.e2e-chromium-cache
          key: e2e-chromium-${{ hashFiles('apps/web/package.json') }}

      - name: Install Chromium for Playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: apps/web/.e2e-chromium-cache
        run: pnpm setup:e2e

      - name: Playwright e2e (public prerendered site, desktop Chrome + Pixel 7)
        env:
          PLAYWRIGHT_BROWSERS_PATH: apps/web/.e2e-chromium-cache
        run: pnpm test:web:e2e


  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, docs, web, backend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          # The docs gate is not skippable: it runs on every push, so a docs-only push that
          # breaks the markdown fails the gate instead of sailing past it.
          for r in "$CHANGES_RESULT" "$DOCS_RESULT" "$WEB_RESULT" "$BACKEND_RESULT"; do
            case "$r" in
              success|skipped) ;;
              *) echo "heavy job did not pass: $r"; exit 1 ;;
            esac
          done